<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Три колонки доски с убывающей заполненностью.

    Плашка залита намеренно: контурный знак на вкладке теряется, когда цвет
    обводки совпадает с фоном вкладки.

    Вся геометрия — чётные числа. При отрисовке в 16px две единицы viewBox
    дают один пиксель, поэтому чётные координаты ложатся точно на сетку:
    столбики по 4px, зазоры по 1px, без размытия сглаживанием.
  -->
  <rect width="32" height="32" rx="7" fill="#4b83f0"/>
  <g fill="#ffffff">
    <rect x="2"  y="6" width="8" height="20" rx="4"/>
    <rect x="12" y="6" width="8" height="15" rx="4"/>
    <rect x="22" y="6" width="8" height="10" rx="4"/>
  </g>
</svg>
